# Project-wide Gradle settings.

# Increase JVM heap to avoid OutOfMemoryError during build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compiler daemon heap (mirrors Gradle daemon heap).
kotlin.daemon.jvm.options=-Xmx4g

# Enable Gradle build cache and parallel execution.
org.gradle.caching=true
org.gradle.parallel=true

# Enable configuration caching for faster incremental builds.
org.gradle.configuration-cache=true

# Android-specific settings.
android.useAndroidX=true
android.nonTransitiveRClass=true
